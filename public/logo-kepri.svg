<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <path id="chain-link" d="M -7 -3 L 7 -3 C 8.5 -3 9.5 -2 9.5 0 C 9.5 2 8.5 3 7 3 L -7 3 C -8.5 3 -9.5 2 -9.5 0 C -9.5 -2 -8.5 -3 -7 -3 Z" fill="none" stroke="#2b5329" stroke-width="1.8" />
    <path id="chain-inner" d="M -4.5 -1.2 L 4.5 -1.2 C 5.5 -1.2 6 -0.6 6 0 C 6 0.6 5.5 1.2 4.5 1.2 L -4.5 1.2 C -5.5 1.2 -6 0.6 -6 0 C -6 -0.6 -5.5 -1.2 -4.5 -1.2 Z" fill="#2b5329" />
    <!-- Text path for PROVINSI KEPULAUAN RIAU -->
    <path id="curve-text-path" d="M 85 102 C 145 68 255 68 315 102" fill="none" />
