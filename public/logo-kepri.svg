    <path d="M 92 298 Q 107 293 122 298 T 152 298 T 182 298 T 212 298 T 242 298 T 272 298 T 302 298 T 308 298" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 96 310 Q 111 305 126 310 T 156 310 T 186 310 T 216 310 T 246 310 T 276 310 T 304 310" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 102 322 Q 117 317 132 322 T 162 322 T 192 322 T 222 322 T 252 322 T 282 322 T 298 322" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 112 334 Q 127 329 142 334 T 172 334 T 202 334 T 232 334 T 262 334 T 288 334" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
