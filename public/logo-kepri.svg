    <rect x="290" y="305" width="18" height="8" rx="4" transform="rotate(35 299 309)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="255" y="330" width="18" height="8" rx="4" transform="rotate(35 264 334)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="220" y="355" width="18" height="8" rx="4" transform="rotate(35 229 359)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
