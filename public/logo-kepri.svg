    <rect x="350" y="112" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="355" y="145" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="360" y="178" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="362" y="212" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="358" y="246" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <!-- Right slant down to point -->
