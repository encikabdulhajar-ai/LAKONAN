      <path d="M -3 6 L 0 10 L 3 6 Z" fill="#15803d" />
      <circle cx="-5.5" cy="0" r="7" fill="#ffffff" stroke="#111" stroke-width="1" />
      <circle cx="5.5" cy="0" r="7" fill="#ffffff" stroke="#111" stroke-width="1" />
      <circle cx="0" cy="-5" r="7" fill="#ffffff" stroke="#111" stroke-width="1" />
      <circle cx="0" cy="2" r="5" fill="#f8fafc" />
    </g>

    <!-- Boll 9 -->
