    <rect x="249" y="30" width="16" height="7" rx="3.5" transform="rotate(-16 257 33)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="284" y="40" width="16" height="7" rx="3.5" transform="rotate(-16 292 43)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <!-- Right side down -->
