    <rect x="42" y="112" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="37" y="145" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="32" y="178" width="8" height="18" rx="4" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
