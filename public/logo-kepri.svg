    <polygon points="388,365 370,388 388,410 360,410 328,365" fill="#eab308" stroke="#111" stroke-width="2.5" />

    <!-- Main Front Arched Ribbon -->
    <path d="M 40 375 C 130 405 270 405 360 375 L 360 415 C 270 455 130 455 40 415 Z" fill="#ffeb3b" stroke="#111" stroke-width="3.5" />

    <!-- Inner Ribbon Fold Shadows -->
    <path d="M 40 415 C 80 432 130 442 200 444 C 270 442 320 432 360 415 L 358 418 C 318 435 268 445 200 447 C 132 445 82 435 42 418 Z" fill="#bfa300" />
    <path d="M 40 375 C 80 390 130 398 200 400 C 270 398 320 390 360 375 L 358 377 C 318 392 268 400 200 402 C 132 400 82 392 42 377 Z" fill="#fff799" />
  </g>

  <!-- Motto Text on Ribbon: BERPANCANG AMANAH BERSAUH MARWAH -->
  <path id="ribbon-text-path" d="M 50 418 C 135 448 265 448 350 418" fill="none" />
  <text font-family="'Arial Black', Arial, sans-serif" font-size="14.5" font-weight="900" fill="#000000" letter-spacing="1">
    <textPath href="#ribbon-text-path" startOffset="50%" text-anchor="middle">
