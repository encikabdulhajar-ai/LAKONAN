    <ellipse cx="100" cy="150" rx="12" ry="6" transform="rotate(-5 100 150)" />
    <ellipse cx="102" cy="175" rx="12" ry="6" transform="rotate(10 102 175)" />
    <ellipse cx="110" cy="200" rx="12" ry="6" transform="rotate(25 110 200)" />
    <ellipse cx="125" cy="220" rx="12" ry="6" transform="rotate(40 125 220)" />
