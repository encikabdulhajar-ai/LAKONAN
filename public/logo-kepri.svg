      <circle cx="-6" cy="0" r="8" fill="#ffffff" stroke="#111" stroke-width="1" />
      <circle cx="6" cy="0" r="8" fill="#ffffff" stroke="#111" stroke-width="1" />
      <circle cx="0" cy="-5" r="8" fill="#ffffff" stroke="#111" stroke-width="1" />
      <circle cx="0" cy="2" r="5" fill="#f8fafc" />
