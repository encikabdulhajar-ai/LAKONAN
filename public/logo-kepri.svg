    <ellipse cx="98" cy="100" rx="14" ry="7" transform="rotate(-40 98 100)" />
    <ellipse cx="112" cy="88" rx="14" ry="7" transform="rotate(-50 112 88)" />
    <ellipse cx="130" cy="80" rx="14" ry="7" transform="rotate(-60 130 80)" />
    <ellipse cx="150" cy="74" rx="14" ry="7" transform="rotate(-70 150 74)" />
    <ellipse cx="168" cy="70" rx="14" ry="7" transform="rotate(-80 168 70)" />

    <ellipse cx="83" cy="135" rx="14" ry="7" transform="rotate(-20 83 135)" />
    <ellipse cx="79" cy="160" rx="14" ry="7" transform="rotate(-5 79 160)" />
    <ellipse cx="80" cy="185" rx="14" ry="7" transform="rotate(10 80 185)" />
    <ellipse cx="85" cy="210" rx="14" ry="7" transform="rotate(25 85 210)" />
    <ellipse cx="98" cy="232" rx="14" ry="7" transform="rotate(40 98 232)" />
    <ellipse cx="118" cy="250" rx="14" ry="7" transform="rotate(55 118 250)" />
    <ellipse cx="140" cy="265" rx="14" ry="7" transform="rotate(70 140 265)" />

