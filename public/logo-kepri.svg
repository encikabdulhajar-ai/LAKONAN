    <rect x="100" y="38" width="16" height="7" rx="3.5" transform="rotate(16 108 41)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="135" y="27" width="16" height="7" rx="3.5" transform="rotate(16 143 30)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
    <rect x="170" y="18" width="16" height="7" rx="3.5" transform="rotate(16 178 21)" fill="#4e8d44" stroke="#111" stroke-width="1.5" />
